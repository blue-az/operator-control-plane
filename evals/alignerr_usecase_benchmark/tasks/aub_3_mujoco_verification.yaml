id: AUB-3
name: MuJoCo / robotics verification methodology
task_type: technical_benchmark_design
source_artifacts:  # local-only; see sources.local.json (gitignored)
  - simulation prep brief
  - GPU/CPU benchmark notes
  - domain crib notes
  - simulation lessons learned
prompt: >
  Given saved MuJoCo/RL notes, extract the benchmarkable claims and propose rerunnable verification gates.
  Separate throughput from convergence, single-env Gym-MuJoCo from MJX/GPU physics, and contact/model
  invariants from subjective visual assessment.
expected_findings:
  - Use closed-form geometry checks for kinematic site distances.
  - Use mj_forward, not mj_step, for set-pose/read-sensor tests.
  - Treat support force equals weight as a contact invariant after filtering self-contacts.
  - Preserve the CPU/GPU crossover finding: default PPO/SAC do not benefit from GPU; scaled SAC does.
  - State scope limits: throughput not convergence where applicable, single env, power-capped GPU.

# See aub_1 for why the old 0-3 `rubric:` block was replaced. Classes are
# reported separately and never summed.
scoring:
  contract_sections: [MEASURED_CLAIMS, RERUNNABLE_GATES, PHYSICS_API_RULES, SCOPE_LIMITS]

  verdict:
    - name: mj_forward_not_mj_step
      section: PHYSICS_API_RULES
      patterns: ['mj_forward']
      forbidden: ['mj_step .{0,30}(set-?pose|read-?sensor)', 'use mj_step to (set|read)']
      note: >
        Correct API for set-pose/read-sensor. Naming mj_forward while also
        prescribing mj_step for the same test fails.
    - name: gpu_cpu_crossover_direction
      patterns:
        - 'default .{0,40}(PPO|SAC).{0,60}(not|no) .{0,20}benefit'
        - 'GPU .{0,25}(slower|no faster|not faster)'
        - 'CPU .{0,25}(faster|outperform)'
        - 'scaled SAC .{0,30}benefit'
      note: >
        Direction matters, not the digits. The old pattern matched the bare
        string "3.0", which hits any version number or dollar amount.

  coverage:
    - name: closed_form
      patterns: ['closed[- ]form', 'analytic(al)? .{0,20}(check|solution)']
    - name: support_equals_weight
      patterns: ['support .{0,40}weight', 'contact.{0,20}force.{0,40}weight', '(sum|total).{0,30}force.{0,40}weight', 'normal force.{0,40}weight']
    - name: self_contact_filtering
      patterns: ['self[- ]contact', 'grandparent', 'exclude .{0,20}own']
    - name: throughput_not_convergence
      patterns: ['throughput .{0,30}not .{0,20}convergence', 'not .{0,15}convergence', 'steps?/s(ec)? .{0,30}not .{0,20}learn']
    - name: mjx_distinction
      patterns: ['MJX', 'Gym-?MuJoCo', 'GPU physics', 'batched .{0,20}(env|sim)']

  manual:
    - name: scope_honesty
      criterion: >
        Are the stated limits real constraints on the conclusions drawn, or a
        generic caveats paragraph that does not bind any specific claim?
    - name: gate_rerunnability
      criterion: >
        Could someone actually rerun the proposed gates from what is written --
        concrete commands, thresholds, pass/fail criteria?
