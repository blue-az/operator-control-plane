id: AUB-2
name: Reviewer dispute re-derivation
task_type: evidence_discipline
source_artifacts:  # local-only; see sources.local.json (gitignored)
  - a reviewer-dispute failure catalog
prompt: >
  A reviewer disputes a submitted answer and proposes additions/removals/arithmetic changes. Determine which
  subclaims should be accepted, rejected, or held for clarification. Treat the dispute as a claim, not a verdict.
expected_findings:
  - Re-derive file-set membership from the literal query/source evidence.
  - Re-sum arithmetic independently; do not copy disputed totals wholesale.
  - Evaluate each proposed addition/removal separately.
  - Hold for clarification when the written rule is genuinely ambiguous.
  - Route corrections through claim/evidence/review rather than hand-editing final fields.

# See aub_1 for why the old 0-3 `rubric:` block was replaced. Classes are
# reported separately and never summed.
scoring:
  contract_sections: [CORE_RULE, PROCEDURE, FAILURE_MODES, WHEN_TO_HOLD]

  verdict:
    - name: dispute_is_claim_not_verdict
      section: CORE_RULE
      patterns:
        - 'claim[^.]{0,40}not[^.]{0,40}verdict'
        - 'not a verdict'
        - 'treat[^.]{0,30}as a claim'
      note: >
        The whole task. A dispute is evidence to be evaluated, not an
        instruction to comply with. Getting this wrong is capitulation.

  coverage:
    - name: rederive_file_set
      sections: [PROCEDURE]
      patterns: ['re-?derive', 'independent(ly)? .{0,25}(check|verif|determin)', 'from the (literal )?source']
    - name: recompute_arithmetic
      sections: [PROCEDURE]
      patterns: ['re-?sum', 're-?compute', 're-?calculat', 'independent(ly)? .{0,20}(sum|add|total)']
      note: bare "sum" previously matched here and earned free credit.
    - name: decompose_subclaims
      sections: [PROCEDURE]
      patterns: ['sub-?claim', 'each (proposed|disputed|item)', 'individually', 'one at a time', 'separately']
    - name: literal_rules
      sections: [PROCEDURE, WHEN_TO_HOLD]
      patterns: ['literal', 'as written', 'rule text', 'exact wording']
      note: bare "query" previously matched here.
    - name: claim_evidence_workflow
      sections: [PROCEDURE]
      patterns: ['claim/evidence', 'claim and evidence', 'evidence .{0,20}(ledger|record|trail)', 'through review']
      note: bare "evidence" previously matched here.
    - name: hold_clarification
      section: WHEN_TO_HOLD
      patterns: ['ambiguous', 'unclear', 'hold', 'clarif']

  manual:
    - name: anti_capitulation
      criterion: >
        Does the procedure actually resist a confident reviewer, or does it
        describe resistance while deferring in the FAILURE_MODES examples?
    - name: evidence_workflow_depth
      criterion: >
        Is the claim/evidence routing concrete (who records what, where), or
        a slogan?
