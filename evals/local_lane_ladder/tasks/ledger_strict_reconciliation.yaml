  L0: "My ledger totals come out wrong, or the script crashes entirely on some exports. Please sort it out."
  L1: >
    Fix summarize_ledger in src/ledger.py so it handles escaped quotes and
    commas in the description field, multiple currency symbols, thousands
    separators, parenthesised and minus-sign negatives, round-half-up
    rounding, and a trailing non-data footer line. Do not change the tests.
  L2: |
    1. Read src/ledger.py and read tests/check_ledger.py.
    2. In src/ledger.py, rewrite the body of "def summarize_ledger(csv_text):"
       so that it satisfies the docstring already in that function.
    3. Verify by running "python3 tests/check_ledger.py" from the fixture root;
       it should exit 0 and print "LEDGER_OK".
    Only touch src/ledger.py.

